<!DOCTYPE html>
<html lang="en">
<head>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}
		#startButton {
			display: block; width: 160px; height: 40px; background-color: #4CAF50; color: white;
			text-align: center; font-size: 16px; margin: 20px auto; padding: 10px 20px;
			border: none; border-radius: 8px; cursor: pointer; font-family: sans-serif;
		}
		#game {
			width: 100% !important;
			height: 100% !important;
		}
	</style>
</head>
<body>
	<div style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center;">
		<div id="game" style="display: none; width: 100%; height: 100%;"></div>
		<button id="startButton">PLAY TETRIS</button>
	</div>
	<script>
            function startGame() {
                document.getElementById("game").style.display = "block";
                document.getElementById("startButton").style.display = "none";
                window.EJS_player = "#game";
                window.EJS_core = "gba";
                window.EJS_gameUrl = "/api/game-proxy/tetris-rom/Tetris%20(World)%20(Rev%201).zip"; 
                window.EJS_pathtodata = "/api/game-proxy/emulatorjs/";
                window.EJS_startOnLoaded = true;
                window.EJS_gameID = "tetris";
                window.EJS_gameName = "Tetris";
                
                var script = document.createElement("script");
                script.src = "/api/game-proxy/emulatorjs/loader.js";
                document.body.appendChild(script);
            }  
            document.getElementById("startButton").addEventListener("click", startGame);
	</script>
</body>
</html>
