<!DOCTYPE html>
<html lang="en">
<head>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}
		#startButton {
			display: block; width: 160px; height: 40px; background-color: #4CAF50; color: white;
			text-align: center; font-size: 16px; margin: 20px auto; padding: 10px 20px;
			border: none; border-radius: 8px; cursor: pointer; font-family: sans-serif;
		}
		#game {
			width: 100% !important;
			height: 100% !important;
		}
	</style>
</head>
<body>
	<div style="width: 100vw; height: 100vh;">
		<div id="game" style="display: none;"></div>
		<button id="startButton">PLAY TETRIS</button>
	</div>
	<script>
            function startGame() {
                document.getElementById("game").style.display = "block";
                document.getElementById("startButton").style.display = "none";
                window.EJS_player = "#game";
                window.EJS_core = "gba";
                window.EJS_gameUrl = "https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@c39521ba7e7523bc039606d7befe445d2929c916/Tetris%20(World)%20(Rev%201).zip"; 
                window.EJS_pathtodata = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/";
                window.EJS_startOnLoaded = true;
                var script = document.createElement("script");
                script.src = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/loader.js";
                document.body.appendChild(script);
            }  
            document.getElementById("startButton").addEventListener("click", startGame);
	</script>
</body>
</html>
