<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>WebBlox Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        canvas#canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #logo {
            width: 400px;
            max-width: 80%;
            margin-bottom: 50px;
            image-rendering: auto;
        }

        #loading-text {
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <img id="logo" src="/api/webblox-proxy?file=WebBlox.png">
        <span id="loading-text">Loading WebBlox Demo...</span>
    </div>
    <canvas id="canvas" oncontextmenu="return false"></canvas>
    <script>(function () {
    var loadingDiv  = document.getElementById('loading');
    var loadingText = document.getElementById('loading-text');

    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    console.log  = function () {};
    console.warn = function () {};
    console.info = function () {};
    console.debug = function () {};

    var CHUNK_COUNT = 12;
    var loaded = 0;

    var chunksPromise = Promise.all(
      Array.from({ length: CHUNK_COUNT }, function (_, i) {
        return fetch('/api/webblox-proxy?file=rblx.data.' + i).then(function (r) {
          if (!r.ok) throw new Error('chunk ' + i + ' failed');
          return r.arrayBuffer().then(function (b) {
            loaded++;
            loadingText.textContent = 'Downloading Assets: ' + Math.round(loaded / CHUNK_COUNT * 100) + '%';
            return b;
          });
        });
      })
    ).then(function (chunks) {
      var total = chunks.reduce(function (s, c) { return s + c.byteLength; }, 0);
      var out   = new Uint8Array(total);
      var off   = 0;
      chunks.forEach(function (c) { out.set(new Uint8Array(c), off); off += c.byteLength; });
      return URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' }));
    }).catch(function(err) {
      console.error(err);
      loadingText.textContent = 'Load Failed. Retrying in 2 seconds...';
      setTimeout(function() { window.location.reload(); }, 2000);
    });

    var _origFetch = window.fetch.bind(window);
    window.fetch = function (resource, init) {
      var url = (typeof resource === 'string') ? resource : (resource && resource.url) || '';
      if (/rblx\.data$/.test(url)) {
        return chunksPromise.then(function (blobUrl) { return _origFetch(blobUrl, init); });
      }
      if (url.includes('rblx.wasm')) {
        return _origFetch('/api/webblox-proxy?file=rblx.wasm', init);
      }
      return _origFetch(resource, init);
    };

    var _origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url, ...rest) {
      if (typeof url === 'string' && url.includes("rblx.wasm")) {
        url = "/api/webblox-proxy?file=rblx.wasm";
      }
      return _origOpen.call(this, method, url, ...rest);
    };

    window.Module = {
      canvas: document.getElementById('canvas'),
      print:    function () {},
      printErr: function (t) { if (/error|exception/i.test(t)) console.error('[rblx]', t); },
      setStatus: function (t) {
        if (!t) { loadingDiv.style.display = 'none'; return; }
        var m = t.match(/\((\d+)\/(\d+)\)/);
        if (m) {
          var pct = Math.round(parseInt(m[1], 10) / parseInt(m[2], 10) * 100);
          loadingText.textContent = 'Launching WebBlox: ' + pct + '%';
        }
      },
      onRuntimeInitialized: function () { loadingDiv.style.display = 'none'; }
    };

    var s = document.createElement('script');
    s.src = '/api/webblox-proxy?file=rblx.js';
    document.body.appendChild(s);
  })();</script>
</body>
</html>
