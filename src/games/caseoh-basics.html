<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="/api/game-proxy/caseoh-basics/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | CaseOhs Basics in Eating and Fast Food</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script>
    window.fileMergerConfig = {
      files: [
        { name: 'web.data.unityweb', parts: 2 },
        { name: 'web.wasm.code.unityweb', parts: 2 },
      ],
      basePath: 'Build/',
      debug: true
    };
    </script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/merge.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var unityInstance = UnityLoader.instantiate("unityContainer", "Build/web.json", {onProgress: UnityProgress});
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .webgl-content { width: 100%; height: 100%; }
      #unityContainer { width: 100% !important; height: 100% !important; }
    </style>
  </head>
  <body>
    <div class="webgl-content">
      <div id="unityContainer" style="width: 100vw; height: 100vh"></div>
    </div>
  </body>
</html>
