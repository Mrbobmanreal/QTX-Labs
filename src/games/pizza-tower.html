<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="/api/game-proxy/pizza-tower/">
    <meta charset="utf-8" />
    <title>Pizza Tower Web Port</title>
    <link rel="stylesheet" href="index.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div class="loading">
        <div class="spinner" id="spinner"></div>
        <div class="emscripten" id="status">Downloading...</div>
    </div>
    <script>
      function mergeFiles(fileParts) {
          return new Promise((resolve, reject) => {
              let buffers = [];
              function fetchPart(index) {
                  if (index >= fileParts.length) {
                      let mergedBlob = new Blob(buffers);
                      resolve(URL.createObjectURL(mergedBlob));
                      return;
                  }
                  fetch(fileParts[index]).then(r => r.arrayBuffer()).then(data => {
                      buffers.push(data);
                      fetchPart(index + 1);
                  }).catch(reject);
              }
              fetchPart(0);
          });
      }
      function getParts(file, start, end) {
          let parts = [];
          for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
          return parts;
      }
      mergeFiles(getParts("game.unx", 1, 13)).then(url => {
          window.gameUnxUrl = url;
          const originalFetch = window.fetch;
          window.fetch = async function (...args) {
              let [url, options] = args;
              if (typeof url === 'string' && url.includes("game.unx")) url = window.gameUnxUrl;
              return originalFetch.call(this, url, options);
          };
          let index = document.createElement("script");
          index.src = "index.js";
          document.body.appendChild(index);
          let runner = document.createElement("script");
          runner.src = "runner.js";
          document.body.appendChild(runner);
      });
    </script>      
  </body>
</html>
