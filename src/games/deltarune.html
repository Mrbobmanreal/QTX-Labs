<!DOCTYPE html>
<html lang="en">
<head>
  <style> body { margin: 0; background: black; overflow: hidden; } iframe { width: 100vw; height: 100vh; border: none; } </style>
</head>
<body>
<script>
  launch()
  function launch() {
    fetch('/api/raw-proxy?url=' + encodeURIComponent('https://rawcdn.githack.com/genizy/web-port/1102f068fff0083d2a5ed979ebac6425540d78a5/deltarune/index.html'))
      .then(r => r.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => {
        console.error('Failed to load Deltarune:', err);
      });
  }
</script>
</body>
</html>
