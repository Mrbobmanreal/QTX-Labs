<!DOCTYPE html>
<html lang="en">
<head>
  <style> body { margin: 0; background: black; overflow: hidden; } iframe { width: 100vw; height: 100vh; border: none; } </style>
</head>
<body>
<script>
  launch()
  function launch() {
    fetch('https://rawcdn.githack.com/genizy/web-port/1102f068fff0083d2a5ed979ebac6425540d78a5/deltarune/index.html?t=' + Date.now())
      .then(r => r.text())
      .then(html => {
        document.documentElement.innerHTML = html
        document.documentElement.querySelectorAll('script').forEach(oldScript => {
          const newScript = document.createElement('script')
          if (oldScript.src) newScript.src = oldScript.src
          else newScript.textContent = oldScript.textContent
          document.body.appendChild(newScript)
        })
      })
  }
</script>
</body>
</html>
