<!DOCTYPE HTML>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Portal (Source WebGL Engine)</title>
    <base href="https://yikes.pw/portal/">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0d0e12;
        color: #ffffff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        overflow: hidden;
      }
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      div.emscripten { text-align: center; }
      div.emscripten_border { border: 0px none; width: 100vw; height: 100vh; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        border: 0px none;
        background-color: black;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #emscripten_logo {
        display: inline-block;
        margin: 0;
        padding: 6px;
        width: 160px;
      }
      .spinner {
        height: 24px;
        width: 24px;
        margin: 0;
        margin-top: 15px;
        margin-left: 15px;
        display: inline-block;
        vertical-align: top;
        animation: rotation 0.8s linear infinite;
        border-left: 4px solid #00f0ff;
        border-right: 4px solid #00f0ff;
        border-bottom: 4px solid #00f0ff;
        border-top: 4px solid rgba(255, 255, 255, 0.2);
        border-radius: 100%;
        background-color: transparent;
      }
      @keyframes rotation {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      #status {
        display: inline-block;
        vertical-align: top;
        margin-top: 18px;
        margin-left: 12px;
        font-weight: bold;
        color: #00f0ff;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      #progress {
        height: 8px;
        width: 260px;
        accent-color: #00f0ff;
        margin-top: 10px;
      }
      #controls {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 100;
      }
      #controls input {
        background: rgba(0, 240, 255, 0.15);
        border: 1px solid rgba(0, 240, 255, 0.4);
        color: #00f0ff;
        padding: 6px 14px;
        border-radius: 6px;
        font-family: inherit;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
      }
      #controls input:hover {
        background: #00f0ff;
        color: #000000;
      }
      #output {
        display: none;
      }
      #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #0d0e12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 50;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }
      #loading-overlay.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <img id="emscripten_logo" src="assets/portal.svg" alt="Portal Logo">
      <div style="display: flex; align-items: center; margin-top: 10px;">
        <div class="spinner" id="spinner"></div>
        <div class="emscripten" id="status">Downloading Portal assets...</div>
      </div>
      <div class="emscripten" style="margin-top: 15px;">
        <progress value="0" max="100" id="progress"></progress>
      </div>
    </div>

    <span id="controls">
      <span><input type="button" value="🖥️ FULLSCREEN" onclick="Module.requestFullscreen(false, false)"></span>
    </span>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <textarea id="output" rows="8"></textarea>

    <script type="text/javascript">
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      var overlayElement = document.getElementById('loading-overlay');

      if (outputElement) outputElement.value = '';

      canvasElement.addEventListener('webglcontextlost', function (e) {
        alert('WebGL context lost. Please reload the page.');
        e.preventDefault();
      }, false);

      canvasElement.widthNative = screen.availWidth;
      canvasElement.heightNative = screen.availHeight;

      var Module = {
        print: function() {
          var args = Array.prototype.slice.call(arguments);
          console.log(args.join(' '));
        },
        canvas: canvasElement,
        setStatus: function(text) {
          Module.setStatus.last = Module.setStatus.last || { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2], 10) * 100;
            progressElement.max = parseInt(m[4], 10) * 100;
            progressElement.hidden = false;
            spinnerElement.style.display = 'inline-block';
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) {
              spinnerElement.style.display = 'none';
              if (overlayElement) overlayElement.classList.add('hidden');
            }
          }
          statusElement.innerHTML = text || 'Ready!';
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing Portal Engine... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
        }
      };

      Module.setStatus('Downloading Portal...');
      window.onerror = function(event) {
        Module.setStatus('Exception thrown, check JS console');
        spinnerElement.style.display = 'none';
      };
    </script>
    <script async type="text/javascript" src="hl2_launcher.js"></script>
  </body>
</html>
