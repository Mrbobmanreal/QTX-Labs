<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/undertale-yellow/">
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="x-icon" href="favicon.png">
    <title>UNDERTALE YELLOW</title>
    <style>
      @-webkit-keyframes rotation {
        from { -webkit-transform: rotate(0deg); }
        to { -webkit-transform: rotate(360deg); }
      }
      @keyframes rotation {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      html { background: #000; width: 100%; height: 100%; }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        place-items: center;
        justify-content: center;
      }
      canvas.emscripten {
        width: 100% !important;
        height: 100% !important;
        display: none;
        background-color: black;
        opacity: 0;
        image-rendering: pixelated;
      }
      canvas.active {
        animation: fadeIn 2s;
        opacity: 1;
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .spinner {
        height: 30px;
        width: 30px;
        animation: rotation 0.8s linear infinite;
        border: 5px solid #bdff00;
        border-top: 5px solid #719900;
        border-radius: 100%;
      }
      #status { font-weight: bold; color: white; }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div class="loading">
      <div class="spinner" id="spinner"></div>
      <div class="emscripten" id="status">Downloading...</div>
      <progress value="0" max="100" id="progress" hidden="1"></progress>
    </div>
    <script>
      function mergeFiles(fileParts) {
          return new Promise((resolve, reject) => {
              let buffers = [];
              function fetchPart(index) {
                  if (index >= fileParts.length) {
                      let mergedBlob = new Blob(buffers);
                      resolve(URL.createObjectURL(mergedBlob));
                      return;
                  }
                  fetch(fileParts[index]).then(r => r.arrayBuffer()).then(data => {
                      buffers.push(data);
                      fetchPart(index + 1);
                  }).catch(reject);
              }
              fetchPart(0);
          });
      }
      function getParts(file, start, end) {
          let parts = [];
          for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
          return parts;
      }
      mergeFiles(getParts("game.unx", 1, 12)).then(url => {
          window.gameUnxUrl = url;
          const originalFetch = window.fetch;
          window.fetch = async function (...args) {
              let [url, options] = args;
              if (typeof url === 'string' && url.includes("game.unx")) url = window.gameUnxUrl;
              return originalFetch.call(this, url, options);
          };
          let index = document.createElement("script");
          index.src = "index.js";
          document.body.appendChild(index);
          let runner = document.createElement("script");
          runner.src = "runner.js";
          document.body.appendChild(runner);
      });
    </script>      
  </body>
</html>
